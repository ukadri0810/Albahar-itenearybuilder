<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#14243a">
  <meta name="description" content="Al Bahar Journey Desk – custom travel itineraries, made simple.">
  <title>Journey Desk — Al Bahar Tours & Travels</title>
  <link rel="icon" href="assets/al-bahar-logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <div id="app">
    <aside class="rail" id="rail">
      <a class="rail-brand" href="#" aria-label="Al Bahar Journey Desk" data-act="home"><span class="rail-logo-frame"><img src="assets/al-bahar-logo.png" alt="Al Bahar Tours & Travels logo"></span><span class="rail-brand-txt"><b>JOURNEY DESK</b><small>AL BAHAR TOURS & TRAVELS</small></span></a>
      <div class="rail-stamp">TRAVEL DESIGN WORKSPACE</div>
      <nav class="rail-nav" aria-label="Main navigation">
        <button class="nav-item active" data-view="workspace"><span class="nav-glyph">▦</span> Itinerary desk</button>
        <button class="nav-item" data-view="trips"><span class="nav-glyph">▤</span> Saved journeys <span class="nav-counter" id="navTripCount">0</span></button>
        <button class="nav-item" data-view="masters"><span class="nav-glyph">▧</span> Master templates</button>
        <button class="nav-item" data-view="agency"><span class="nav-glyph">◎</span> Agency & staff</button>
      </nav>
      <div class="rail-bottom"><span class="rail-line"></span><small>MADE FOR TRAVEL PLANNERS</small><p>One well-designed itinerary. Every destination, every customer.</p><span class="rail-edition">PRIVATE DEMO / 02</span></div>
    </aside>
    <div class="main-shell">
      <header class="top-header">
        <div class="top-left"><button class="mobile-trigger" type="button" data-act="toggle-menu" aria-label="Toggle menu">☰</button><span class="crumb-main">AL BAHAR <span class="crumb-sep">/</span> <span id="crumbView">ITINERARY DESK</span></span></div>
        <div class="top-actions"><span class="save-state" id="saveState">●&nbsp; Saved on this device</span><button class="btn quiet" type="button" data-act="open-preview">Preview</button><button class="btn dark" type="button" data-act="print-pdf">Export PDF <span aria-hidden="true">↗</span></button></div>
      </header>
      <main id="screen" tabindex="-1"></main>
    </div>
  </div>
  <div id="dialogBackdrop" class="dialog-backdrop" hidden><div id="dialogBody" class="dialog" role="dialog" aria-modal="true"></div></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <div id="printRoot" aria-hidden="true"></div>
  <input id="jsonInput" type="file" accept="application/json,.json" hidden>
  <input id="coverUpload" type="file" accept="image/png,image/jpeg,image/webp" hidden>
</body>
</html>
